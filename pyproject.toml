[project]
name = "edge-cloud-adaptation"
version = "0.1.0"
description = "Edge-cloud adaptive video analytics API contract starter"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9", "pydantic>=2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
